<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>interior-mapping-webgpu</title>
    <style>
      html, body, #root { margin: 0; width: 100%; height: 100%; background: #cdd4de; }
      #boot { position: fixed; inset: 0; z-index: 200; display: grid; place-items: center; background: #cdd4de; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot" class="tw-boot" role="progressbar" aria-label="载入场景资源" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="tw-boot-card tw-glass">
        <div class="tw-boot-title">室内映射</div>
        <div class="tw-boot-stage">载入场景资源</div>
        <div class="tw-boot-track">
          <div class="tw-boot-cell"><div class="tw-boot-fill"></div></div>
          <div class="tw-boot-cell"><div class="tw-boot-fill"></div></div>
          <div class="tw-boot-cell"><div class="tw-boot-fill"></div></div>
          <div class="tw-boot-cell"><div class="tw-boot-fill"></div></div>
          <div class="tw-boot-cell"><div class="tw-boot-fill"></div></div>
          <div class="tw-boot-cell"><div class="tw-boot-fill"></div></div>
          <div class="tw-boot-cell"><div class="tw-boot-fill"></div></div>
          <div class="tw-boot-cell"><div class="tw-boot-fill"></div></div>
          <div class="tw-boot-cell"><div class="tw-boot-fill"></div></div>
          <div class="tw-boot-cell"><div class="tw-boot-fill"></div></div>
          <div class="tw-boot-cell"><div class="tw-boot-fill"></div></div>
          <div class="tw-boot-cell"><div class="tw-boot-fill"></div></div>
        </div>
        <div class="tw-boot-meta">
          <div class="tw-boot-sub"></div>
          <span class="tw-boot-pct">0%</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
